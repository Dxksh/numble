name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths: [firestore.rules]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only firestore:rules --project numble-code-game --token "$FIREBASE_TOKEN" --non-interactive
